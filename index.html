<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f5c4d">
<title>গাড়ির হিসাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#10302a;--mute:#5f746f;--line:#dbe5e1;--brand:#0f6b57;--brand2:#14906f;--on:#fff;--warn:#c0392b;--ok:#0b8a52;--tok:#e3f5ec;--shadow:0 1px 2px rgba(16,48,42,.06),0 8px 20px rgba(16,48,42,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1412;--card:#14211e;--ink:#e8f2ef;--mute:#90a8a2;--line:#25403a;--brand:#34c0a0;--brand2:#22977f;--on:#04201a;--warn:#ff9285;--ok:#62dba5;--tok:#17332c;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16.5px;line-height:1.55;padding-bottom:96px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:6px 0 2px}h2{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
label{display:block;font-weight:500;margin:13px 0 5px;font-size:15px}
input,textarea,select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
.btn{width:100%;min-height:54px;margin-top:18px;font:inherit;font-weight:700;font-size:17px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--on);border:0;border-radius:14px;box-shadow:0 6px 16px rgba(15,107,87,.28);cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.55}
.link{background:none;border:0;color:var(--brand);font:inherit;font-weight:500;padding:12px 0 0;cursor:pointer;width:100%;text-align:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw{position:relative}.pw button{position:absolute;right:6px;top:5px;height:42px;padding:0 12px;border:0;background:none;color:var(--brand);font:inherit;font-weight:700}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:14px;margin-bottom:6px}
.tabs button{flex:1;min-height:46px;font:inherit;font-weight:500;border:0;background:none;color:var(--mute);border-radius:11px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--brand);font-weight:700;box-shadow:var(--shadow)}
.hd{background:linear-gradient(135deg,#0c5a49,#14906f);color:#fff;margin:-16px -16px 16px;padding:18px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:0 0 24px 24px}
.brand{display:flex;align-items:center;gap:12px}.brand b{font-size:20px;line-height:1.2}
.sub{font-size:14px;opacity:.92;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logo{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);font-size:25px}
.ghost{min-height:40px;padding:0 14px;border:1.5px solid rgba(255,255,255,.55);background:none;color:#fff;border-radius:12px;font:inherit;cursor:pointer}
.badge{font-size:13px;padding:1px 10px;border-radius:99px;background:rgba(255,255,255,.22);color:#fff}
.authhd{text-align:center;padding:26px 0 16px}
.authhd .logo{width:78px;height:78px;font-size:42px;border-radius:24px;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 10px 24px rgba(15,107,87,.3)}
.authhd p{margin:0;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fare{font-weight:700;color:var(--ok);font-size:19px}.cost{color:var(--warn)}.ok{color:var(--ok)}
.mute{color:var(--mute);font-size:14.5px}
.mini{min-height:40px;padding:0 16px;font:inherit;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin:10px 8px 0 0;cursor:pointer}
.mini.del{color:var(--warn);border-color:var(--warn)}
.hero{background:linear-gradient(135deg,#0c5a49,#14906f);color:#fff;border-radius:22px;padding:18px 18px 16px;margin-bottom:12px;box-shadow:0 10px 24px rgba(15,107,87,.25)}
.hero .big{font-size:36px;font-weight:700;line-height:1.2}.hs{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;opacity:.95;margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.g2 .st:last-child:nth-child(odd){grid-column:span 2}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow)}.st b{font-size:20px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:2px;overflow-x:auto;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.08);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:1 0 auto;min-width:76px;background:none;border:0;border-radius:14px;padding:6px 4px;font:inherit;font-size:12.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.nav button i{font-style:normal;font-size:22px;line-height:1.1}
.nav button.on{background:var(--tok);color:var(--brand);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal button{min-height:56px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:2px;line-height:1.25;cursor:pointer}
.cal .h{text-align:center;font-weight:500;font-size:13px;color:var(--mute)}
.cal button.nt{background:var(--bg);color:var(--mute)}
.cal button.sel{outline:3px solid var(--brand)}
#toast{position:fixed;left:12px;right:12px;bottom:92px;max-width:536px;margin:auto;padding:14px 16px;border-radius:14px;color:#fff;font-weight:500;display:none;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media print{.nav,.hd,.mini,#toast,.noprint{display:none!important}body{background:#fff;color:#000}}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<!-- লগইন / রেজিস্ট্রেশন -->
<div id="auth" class="hide">
  <div class="authhd"><div class="logo">🚗</div><h1>গাড়ির হিসাব</h1><p>গাড়ির আয়-ব্যয়ের হিসাব, সহজে</p></div>
  <div class="card">
    <div class="tabs"><button id="tLogin" class="on">লগইন</button><button id="tReg">নতুন অ্যাকাউন্ট</button></div>
    <div id="nameBox" class="hide"><label for="name">আপনার নাম</label><input id="name" autocomplete="name"></div>
    <label for="email">ইমেইল</label><input id="email" type="email" autocomplete="email" inputmode="email">
    <div id="pwBox"><label for="pw">পাসওয়ার্ড</label>
      <div class="pw"><input id="pw" type="password" autocomplete="current-password"><button type="button" id="eye">দেখান</button></div></div>
    <button class="btn" id="go">লগইন করুন</button>
    <button class="link" id="forgot">পাসওয়ার্ড ভুলে গেছেন?</button>
  </div>
</div>

<!-- নতুন পাসওয়ার্ড -->
<div id="reset" class="hide card">
  <h2>নতুন পাসওয়ার্ড দিন</h2>
  <label for="np">নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input id="np" type="password" autocomplete="new-password">
  <button class="btn" id="saveNp">পাসওয়ার্ড সংরক্ষণ করুন</button>
</div>

<!-- মূল অ্যাপ -->
<div id="app" class="hide">
  <header class="hd"><div class="brand"><span class="logo">🚗</span><div><b>গাড়ির হিসাব</b><div class="sub"><span id="who"></span><span id="role" class="badge"></span></div></div></div><button class="ghost" id="out">লগআউট</button></header>
  <nav class="nav"><button id="tDash"><i>📊</i><span>ড্যাশবোর্ড</span></button><button id="tNew" class="on"><i>🚗</i><span>নতুন ট্রিপ</span></button><button id="tExp"><i>💸</i><span>খরচ</span></button><button id="tRent"><i>🏠</i><span>ভাড়া</span></button><button id="tList"><i>📋</i><span>তালিকা</span></button><button id="tRem"><i>🔔</i><span>রিমাইন্ডার</span></button><button id="tCal"><i>📅</i><span>ক্যালেন্ডার</span></button><button id="tRep"><i>📈</i><span>রিপোর্ট</span></button></nav>

  <div id="pNew" class="card">
    <label for="when">তারিখ ও সময়</label><input id="when" type="datetime-local">
    <label for="cn">যাত্রীর নাম</label><input id="cn" autocomplete="off">
    <label for="cp">যাত্রীর ফোন (যেমন ০১৭১২৩৪৫৬৭৮)</label><input id="cp" type="tel" inputmode="tel">
    <div class="row"><div><label for="fp">কোথা থেকে *</label><input id="fp"></div><div><label for="tp">কোথায় *</label><input id="tp"></div></div>
    <div class="row"><div><label for="km">দূরত্ব (কিমি) *</label><input id="km" type="number" inputmode="decimal" min="0" step="0.1"></div>
      <div><label for="fare">ভাড়া (৳) *</label><input id="fare" type="number" inputmode="decimal" min="0"></div></div>
    <div class="row"><div><label for="fuel">তেলের খরচ (৳)</label><input id="fuel" type="number" inputmode="decimal" min="0"></div>
      <div><label for="gas">গ্যাসের খরচ (৳)</label><input id="gas" type="number" inputmode="decimal" min="0"></div></div>
    <div class="row"><div><label for="rep">মেরামত/রক্ষণাবেক্ষণ (৳)</label><input id="rep" type="number" inputmode="decimal" min="0"></div>
      <div><label for="oth">অন্যান্য খরচ (৳)</label><input id="oth" type="number" inputmode="decimal" min="0"></div></div>
    <label for="nt">চালকের নোট</label><textarea id="nt" rows="2"></textarea>
    <label for="img">রসিদের ছবি (গ্যালারি থেকে)</label><input id="img" type="file" accept="image/*">
    <button class="btn" id="save">ট্রিপ সংরক্ষণ করুন</button>
  </div>

  <div id="pList" class="hide"><div id="list"></div></div>
  <div id="pDash" class="hide"><div id="dash"></div></div>
  <div id="pExp" class="hide">
    <div class="card"><h2>খরচ যোগ করুন</h2>
      <label for="ed">তারিখ</label><input id="ed" type="date">
      <label for="ec">খরচের ধরন</label><select id="ec"></select>
      <div id="fuelBox"><div class="row"><div><label for="ft">জ্বালানির ধরন</label><select id="ft"><option>অকটেন</option><option>পেট্রোল</option><option>ডিজেল</option><option>সিএনজি</option></select></div>
        <div><label for="fl">লিটার</label><input id="fl" type="number" inputmode="decimal" min="0"></div></div>
        <label for="fpl">প্রতি লিটার দাম (৳)</label><input id="fpl" type="number" inputmode="decimal" min="0"></div>
      <label for="ea">মোট টাকা (৳) *</label><input id="ea" type="number" inputmode="decimal" min="0">
      <label for="em">পেমেন্ট মাধ্যম</label><select id="em"></select>
      <label for="en">নোট</label><input id="en">
      <button class="btn" id="esave">খরচ সংরক্ষণ করুন</button></div>
    <div id="elist"></div></div>
  <div id="pRent" class="hide">
    <div id="rsum" class="card"></div>
    <div class="card"><h2>ভাড়ার হিসাব যোগ করুন</h2>
      <label for="rk">কী যোগ করবেন</label><select id="rk"><option value="due">ভাড়া পাওনা (দিতে হবে)</option><option value="payment">ভাড়া পরিশোধ করেছি</option></select>
      <label for="rd">তারিখ</label><input id="rd" type="date">
      <label for="ra">টাকা (৳) *</label><input id="ra" type="number" inputmode="decimal" min="0">
      <div id="rmBox" class="hide"><label for="rm">পেমেন্ট মাধ্যম</label><select id="rm"></select>
        <label for="rimg">রসিদের ছবি</label><input id="rimg" type="file" accept="image/*"></div>
      <label for="rn">নোট</label><input id="rn">
      <button class="btn" id="rsave">সংরক্ষণ করুন</button></div>
    <div id="rlist"></div></div>
  <div id="pRem" class="hide">
    <div id="remForm" class="card hide"><h2>রিমাইন্ডার যোগ করুন</h2>
      <label for="xk">ধরন</label><select id="xk"></select>
      <label for="xd">শেষ তারিখ / সার্ভিসের তারিখ</label><input id="xd" type="date">
      <label for="xn">নোট</label><input id="xn">
      <button class="btn" id="xsave">সংরক্ষণ করুন</button></div>
    <div id="remList"></div></div>
  <div id="pCal" class="hide">
    <div class="card"><div class="top"><button class="mini" id="cPrev">আগের মাস</button><b id="calTitle"></b><button class="mini" id="cNext">পরের মাস</button></div>
      <div id="calGrid" class="cal" style="margin-top:10px"></div></div>
    <div id="calDay"></div></div>
  <div id="pRep" class="hide">
    <div class="card noprint"><h2>রিপোর্ট</h2>
      <label for="rpT">ধরন</label><select id="rpT"></select>
      <label for="rpD">তারিখ (এই তারিখের দিন/সপ্তাহ/মাস)</label><input id="rpD" type="date">
      <button class="btn" id="rpGo">রিপোর্ট দেখান</button></div>
    <div id="rpOut"></div>
    <div class="card noprint"><h2>ব্যাকআপ</h2><p class="mute">সব হিসাব একটি ফাইলে ফোনে সংরক্ষণ হবে। মাসে অন্তত একবার নিন।</p>
      <button class="btn" id="bk">ব্যাকআপ ডাউনলোড করুন</button></div></div>
</div>
</div>
<div id="toast"></div>

<script>
/* ===== এখানে নিজের Supabase তথ্য বসান (Project Settings > API) ===== */
const SUPABASE_URL = 'https://vygydewglceniftlbtwt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0u2INR1KfbF479yS4JPPQg_4t7ONHT3';
/* ================================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const bn = n => Number(n || 0).toLocaleString('bn-BD');
const taka = n => '৳ ' + bn(n);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, mode = 'login', tt;

function toast(msg, ok = true) {
  const t = $('#toast'); t.textContent = msg; t.style.background = ok ? '#067647' : '#b42318'; t.style.display = 'block';
  clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 4000);
}
function bnErr(e) {
  const m = (e && e.message || '').toLowerCase();
  if (m.includes('invalid login')) return 'ইমেইল বা পাসওয়ার্ড ভুল হয়েছে।';
  if (m.includes('already registered')) return 'এই ইমেইলে আগেই অ্যাকাউন্ট আছে। লগইন করুন।';
  if (m.includes('not confirmed')) return 'আগে ইমেইলে পাঠানো লিংকে ক্লিক করে ইমেইল যাচাই করুন।';
  if (m.includes('rate limit') || m.includes('too many')) return 'অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।';
  if (m.includes('password')) return 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।';
  if (m.includes('duplicate') || m.includes('trips_no_dup')) return 'এই ট্রিপ আগেই সংরক্ষণ করা হয়েছে।';
  if (m.includes('fetch') || m.includes('network')) return 'ইন্টারনেট সংযোগ নেই। সংযোগ দেখে আবার চেষ্টা করুন।';
  return 'সমস্যা হয়েছে: ' + (e && e.message || 'অজানা');
}
function show(id) { ['#auth', '#reset', '#app'].forEach(x => $(x).classList.toggle('hide', x !== id)); }

/* ---- লগইন ---- */
function setMode(m) {
  mode = m;
  $('#tLogin').classList.toggle('on', m === 'login'); $('#tReg').classList.toggle('on', m === 'reg');
  $('#nameBox').classList.toggle('hide', m !== 'reg');
  $('#go').textContent = m === 'login' ? 'লগইন করুন' : 'অ্যাকাউন্ট খুলুন';
  $('#forgot').classList.toggle('hide', m !== 'login');
  $('#pw').autocomplete = m === 'login' ? 'current-password' : 'new-password';
}
$('#tLogin').onclick = () => setMode('login'); $('#tReg').onclick = () => setMode('reg');
$('#eye').onclick = () => { const p = $('#pw'); const h = p.type === 'password'; p.type = h ? 'text' : 'password'; $('#eye').textContent = h ? 'লুকান' : 'দেখান'; };

$('#go').onclick = async () => {
  const email = $('#email').value.trim(), password = $('#pw').value, name = $('#name').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast('সঠিক ইমেইল দিন।', false);
  if (password.length < 6) return toast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।', false);
  if (mode === 'reg' && !name) return toast('আপনার নাম লিখুন।', false);
  $('#go').disabled = true;
  try {
    if (mode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error;
    } else {
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.href.split('#')[0] } });
      if (error) throw error;
      if (!data.session) { toast('অ্যাকাউন্ট খোলা হয়েছে। ইমেইলে পাঠানো লিংকে ক্লিক করে যাচাই করুন, তারপর লগইন করুন।'); setMode('login'); }
    }
  } catch (e) { toast(bnErr(e), false); }
  $('#go').disabled = false;
};
$('#forgot').onclick = async () => {
  const email = $('#email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast('উপরে আপনার ইমেইল লিখুন, তারপর আবার চাপুন।', false);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });

const num = id => { const v = $('#' + id).value.trim(); return v === '' ? 0 : Number(v); };
const bnDigits = s => s.replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));

function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('ছবি')); }, 'image/jpeg', 0.7);
    };
    img.onerror = () => rej(new Error('ছবি পড়া যায়নি'));
    img.src = url;
  });
}

  for (;;) {
    const { data, error } = await sb.from(table).select(sel).order('created_at', { ascending: true }).range(from, from + 999);
    if (error) return { error };
    out = out.concat(data); if (data.length < 1000) return { data: out }; from += 1000;
  }
}

  const T = (a.data || []).sort((x, y) => new Date(y.trip_at) - new Date(x.trip_at));
  return { err, T, E: b.data || [], R: c.data || [] };
}
const tally = (A, ok) => {
  const Tt = A.T.filter(t => ok(dayOf(t))), Ee = A.E.filter(e => ok(e.spent_on)), Rr = A.R.filter(r => r.kind === 'payment' && ok(r.on_date));
  const i = sum(Tt, t => t.fare), rent = sum(Rr, r => r.amount), x = sum(Tt, tripCost) + sum(Ee, e => e.amount) + rent;
  return { i, x, p: i - x, n: Tt.length, km: sum(Tt, t => t.distance_km), rent, Tt, Ee, Rr };
};
function dl(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
const csvq = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';

/* রিমাইন্ডার */
const RK = { oil: 'ইঞ্জিন অয়েল', tyre: 'টায়ার', battery: 'ব্যাটারি', fitness: 'ফিটনেস', tax: 'ট্যাক্স টোকেন', insurance: 'ইনস্যুরেন্স', other: 'অন্যান্য সার্ভিসিং' };
$('#xk').innerHTML = opt(RK);
async function loadRem() {
  $('#remForm').classList.toggle('hide', me.role !== 'owner');
  if (!$('#xd').value) $('#xd').value = today();
  const { data, error } = await sb.from('reminders').select('*').eq('done', false).order('due_on').limit(200);
  if (error) return $('#remList').innerHTML = '<p class="cost">' + esc(bnErr(error)) + '</p>';
  const td = new Date(today() + 'T00:00');
  $('#remList').innerHTML = '<h2>আসন্ন ও মেয়াদ পার</h2>' + (data.map(r => {
    const days = Math.round((new Date(r.due_on + 'T00:00') - td) / 864e5);
    const txt = days < 0 ? bn(-days) + ' দিন পার হয়েছে' : days === 0 ? 'আজই শেষ' : bn(days) + ' দিন বাকি';
    return `<div class="card"><div class="top"><b>${RK[r.kind]}</b><b class="${days < 0 ? 'cost' : days <= 30 ? '' : 'mute'}">${txt}</b></div>
      <div class="mute">${fmtD(r.due_on)}${r.notes ? ' · ' + esc(r.notes) : ''}</div>
      ${me.role === 'owner' ? `<button class="mini" data-k="${r.id}">সম্পন্ন</button><button class="mini del" data-d="${r.id}">মুছুন</button>` : ''}</div>`;
  }).join('') || '<div class="card mute">কোনো রিমাইন্ডার নেই।</div>');
}
const remRow = rowClick('reminders', loadRem);
$('#remList').onclick = async e => {
  const b = e.target.closest('button');
  if (b && b.dataset.k) {
    const { error } = await sb.from('reminders').update({ done: true }).eq('id', b.dataset.k);
    if (error) return toast(bnErr(error), false);
    toast('সম্পন্ন করা হয়েছে।'); return loadRem();
  }
  remRow(e);
};
$('#xsave').onclick = async () => {
  if (!$('#xd').value) return toast('তারিখ দিন।', false);
  const { error } = await sb.from('reminders').insert({ kind: $('#xk').value, due_on: $('#xd').value, notes: $('#xn').value.trim() });
  if (error) return toast(bnErr(error), false);
  toast('রিমাইন্ডার সংরক্ষণ হয়েছে।'); $('#xn').value = ''; loadRem();
};

/* ক্যালেন্ডার */
let cm = today().slice(0, 7), cAll = null, cSel = null;
async function loadCal() {
  $('#calGrid').innerHTML = '<span class="mute">লোড হচ্ছে...</span>';
  cAll = await loadAll();
  if (cAll.err) return $('#calGrid').innerHTML = '<span class="cost">' + esc(bnErr(cAll.err)) + '</span>';
  drawCal();
}
function drawCal() {
  const [y, m] = cm.split('-').map(Number), first = new Date(y, m - 1, 1), n = new Date(y, m, 0).getDate();
  $('#calTitle').textContent = first.toLocaleDateString('bn-BD', { month: 'long', year: 'numeric' });
  let h = ['রবি', 'সোম', 'মঙ্গল', 'বুধ', 'বৃহ', 'শুক্র', 'শনি'].map(d => `<div class="h">${d}</div>`).join('') + '<span></span>'.repeat(first.getDay());
  for (let d = 1; d <= n; d++) {
    const ds = `${cm}-${String(d).padStart(2, '0')}`, t = tally(cAll, s => s === ds);
    h += `<button class="${ds <= today() && t.n === 0 ? 'nt' : ''}${ds === cSel ? ' sel' : ''}" data-ds="${ds}"><b>${bn(d)}</b><br><span class="${t.p >= 0 ? 'ok' : 'cost'}">${t.i || t.x ? bn(t.p) : ''}</span></button>`;
  }
  $('#calGrid').innerHTML = h; showDay();
}
function showDay() {
  const o = $('#calDay');
  if (!cSel) return o.innerHTML = '<p class="mute">কোনো তারিখে চাপ দিন। ধূসর দিন মানে ট্রিপ হয়নি। সংখ্যা মানে সেই দিনের লাভ।</p>';
  const t = tally(cAll, s => s === cSel);
  o.innerHTML = `<div class="card"><h2>${fmtD(cSel)}</h2><div>আয়: <b class="ok">${taka(t.i)}</b> · খরচ: <b class="cost">${taka(t.x)}</b></div><div>লাভ: <b>${taka(t.p)}</b> · ট্রিপ: ${bn(t.n)}</div></div>`
    + t.Tt.map(x => `<div class="card"><div class="top"><b>${esc(x.from_place)} থেকে ${esc(x.to_place)}</b><span class="fare">${taka(x.fare)}</span></div><div class="mute">${esc(x.profiles?.name || '-')} · ${bn(x.distance_km)} কিমি</div></div>`).join('')
    + t.Ee.map(x => `<div class="card"><div class="top"><b>${CAT[x.category]}</b><span class="cost">${taka(x.amount)}</span></div></div>`).join('')
    + t.Rr.map(x => `<div class="card"><div class="top"><b>ভাড়া পরিশোধ</b><span class="cost">${taka(x.amount)}</span></div></div>`).join('');
}
const shift = k => { const [y, m] = cm.split('-').map(Number), d = new Date(y, m - 1 + k, 1); cm = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; cSel = null; drawCal(); };
$('#cPrev').onclick = () => cAll && shift(-1); $('#cNext').onclick = () => cAll && shift(1);
$('#calGrid').onclick = e => { const b = e.target.closest('button'); if (b) { cSel = b.dataset.ds; drawCal(); } };

/* রিপোর্ট */
$('#rpT').innerHTML = opt({ day: 'দৈনিক', week: 'সাপ্তাহিক (শনি থেকে শুক্র)', month: 'মাসিক' });
const f2 = x => x.toLocaleDateString('en-CA');
function range(ty, ds) {
  const d = new Date(ds + 'T00:00');
  if (ty === 'day') return [ds, ds];
  if (ty === 'week') { const s = new Date(d); s.setDate(d.getDate() - ((d.getDay() + 1) % 7)); const e = new Date(s); e.setDate(s.getDate() + 6); return [f2(s), f2(e)]; }
  return [f2(new Date(d.getFullYear(), d.getMonth(), 1)), f2(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
}
const cmp = (l, c, p, plain) => `<div class="top"><span>${l}</span><span><b>${plain ? bn(c) : taka(c)}</b> <span class="mute">(গত মাস ${plain ? bn(p) : taka(p)})</span></span></div>`;
let lastRep = null;
$('#rpGo').onclick = async () => {
  const out = $('#rpOut'); out.innerHTML = '<p class="mute">লোড হচ্ছে...</p>';
  const A = await loadAll(); if (A.err) return out.innerHTML = '<p class="cost">' + esc(bnErr(A.err)) + '</p>';
  const ty = $('#rpT').value, ds = $('#rpD').value || today(), [a, b] = range(ty, ds), t = tally(A, s => s >= a && s <= b);
  lastRep = { t, a, b };
  const row = (l, v, c = '') => `<div class="top"><span>${l}</span><b class="${c}">${v}</b></div>`;
  let h = `<div class="card"><h2>${ty === 'day' ? 'দৈনিক' : ty === 'week' ? 'সাপ্তাহিক' : 'মাসিক'} রিপোর্ট</h2><div class="mute">${fmtD(a)}${a !== b ? ' থেকে ' + fmtD(b) : ''}</div>
    ${row('মোট আয়', taka(t.i), 'ok')}${row('মোট খরচ (ভাড়া বাদে)', taka(t.x - t.rent), 'cost')}${row('ভাড়া পরিশোধ', taka(t.rent))}
    ${row('মোট ট্রিপ', bn(t.n))}${row('মোট কিমি', bn(t.km))}${row('নিট লাভ', taka(t.p), t.p >= 0 ? 'ok' : 'cost')}</div>`;
  if (ty === 'month') {
    const d0 = new Date(a + 'T00:00'), [pa, pb] = range('month', f2(new Date(d0.getFullYear(), d0.getMonth() - 1, 1))), q = tally(A, s => s >= pa && s <= pb);
    h += `<div class="card"><h2>গত মাসের সাথে তুলনা</h2>${cmp('আয়', t.i, q.i)}${cmp('খরচ', t.x, q.x)}${cmp('নিট লাভ', t.p, q.p)}${cmp('ট্রিপ', t.n, q.n, 1)}</div>`;
  }
  const by = {}; t.Tt.forEach(x => { const k = x.profiles?.name || '-'; by[k] = by[k] || { n: 0, i: 0 }; by[k].n++; by[k].i += +x.fare; });
  h += '<div class="card"><h2>চালক অনুযায়ী</h2>' + (Object.entries(by).map(([k, v]) => row(esc(k) + ' (' + bn(v.n) + ' ট্রিপ)', taka(v.i))).join('') || '<span class="mute">কোনো ট্রিপ নেই</span>') + '</div>';
  out.innerHTML = h + '<div class="noprint"><button class="mini" id="csvB">CSV ডাউনলোড</button><button class="mini" id="pdfB">PDF সংরক্ষণ</button></div>';
};
$('#rpOut').onclick = e => {
  const bt = e.target.closest('button'); if (!bt || !lastRep) return;
  if (bt.id === 'pdfB') { toast('প্রিন্ট পাতায় "Save as PDF" বেছে নিন।'); setTimeout(() => window.print(), 700); }
  if (bt.id === 'csvB') {
    const { t, a, b } = lastRep, rows = [['তারিখ', 'ধরন', 'বিভাগ', 'টাকা', 'বিবরণ']];
    t.Tt.forEach(x => { const d = dayOf(x); rows.push([d, 'আয়', 'ট্রিপ', x.fare, `${x.from_place} থেকে ${x.to_place}`]); if (tripCost(x) > 0) rows.push([d, 'খরচ', 'ট্রিপের খরচ', tripCost(x), '']); });
    t.Ee.forEach(x => rows.push([x.spent_on, 'খরচ', CAT[x.category], x.amount, x.notes || '']));
    t.Rr.forEach(x => rows.push([x.on_date, 'খরচ', 'ভাড়া পরিশোধ', x.amount, x.notes || '']));
    dl(`hisab-${a}-${b}.csv`, '\uFEFF' + rows.map(r => r.map(csvq).join(',')).join('\n'), 'text/csv');
    toast('CSV ফাইল ডাউনলোড হয়েছে।');
  }
};

/* ব্যাকআপ */
$('#bk').onclick = async () => {
  const out = {};
  for (const n of ['profiles', 'trips', 'expenses', 'rent', 'reminders']) {
    const r = await fetchAll(n); if (r.error) return toast(bnErr(r.error), false); out[n] = r.data;
  }
  dl(`gari-hisab-backup-${today()}.json`, JSON.stringify(out, null, 1), 'application/json');
  toast('ব্যাকআপ ফাইল ডাউনলোড হয়েছে।');
};

setMode('login'); start();
</script>
</body>
