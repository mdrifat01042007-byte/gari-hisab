<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f5c4d">
<title>গাড়ির হিসাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#16302b;--mute:#5b706b;--line:#d6e0dc;--brand:#0f5c4d;--on:#fff;--warn:#b42318;--ok:#067647}
@media (prefers-color-scheme:dark){:root{--bg:#0d1715;--card:#15221f;--ink:#e6f1ee;--mute:#92aaa4;--line:#27403a;--brand:#34b49a;--on:#06201a;--warn:#ff8a7a;--ok:#5fd6a0}}
*{box-sizing:border-box}
body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px}h2{font-size:19px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:500;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
.btn{width:100%;min-height:52px;margin-top:16px;font:inherit;font-weight:700;background:var(--brand);color:var(--on);border:0;border-radius:12px;cursor:pointer}
.btn:disabled{opacity:.55}
.link{background:none;border:0;color:var(--brand);font:inherit;text-decoration:underline;padding:10px 0;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;height:40px;padding:0 12px;border:0;background:none;color:var(--brand);font:inherit;font-weight:500}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;min-height:48px;font:inherit;font-weight:500;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px}
.tabs button.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:14px;padding:2px 10px;border-radius:99px;border:1px solid var(--brand);color:var(--brand)}
.fare{font-weight:700;color:var(--ok);font-size:20px}.cost{color:var(--warn)}
.mute{color:var(--mute);font-size:15px}
.mini{min-height:40px;padding:0 14px;font:inherit;border-radius:10px;border:1.5px solid var(--line);background:none;color:var(--ink);margin:8px 8px 0 0}
.mini.del{color:var(--warn);border-color:var(--warn)}
#toast{position:fixed;left:12px;right:12px;bottom:16px;max-width:536px;margin:auto;padding:14px 16px;border-radius:12px;color:#fff;font-weight:500;display:none;z-index:9}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<!-- লগইন / রেজিস্ট্রেশন -->
<div id="auth" class="hide">
  <h1>গাড়ির হিসাব</h1>
  <p class="mute">গাড়ির আয়-ব্যয়ের হিসাব রাখুন</p>
  <div class="card">
    <div class="tabs"><button id="tLogin" class="on">লগইন</button><button id="tReg">নতুন অ্যাকাউন্ট</button></div>
    <div id="nameBox" class="hide"><label for="name">আপনার নাম</label><input id="name" autocomplete="name"></div>
    <label for="email">ইমেইল</label><input id="email" type="email" autocomplete="email" inputmode="email">
    <div id="pwBox"><label for="pw">পাসওয়ার্ড</label>
      <div class="pw"><input id="pw" type="password" autocomplete="current-password"><button type="button" id="eye">দেখান</button></div></div>
    <button class="btn" id="go">লগইন করুন</button>
    <button class="link" id="forgot">পাসওয়ার্ড ভুলে গেছেন?</button>
  </div>
</div>

<!-- নতুন পাসওয়ার্ড -->
<div id="reset" class="hide card">
  <h2>নতুন পাসওয়ার্ড দিন</h2>
  <label for="np">নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input id="np" type="password" autocomplete="new-password">
  <button class="btn" id="saveNp">পাসওয়ার্ড সংরক্ষণ করুন</button>
</div>

<!-- মূল অ্যাপ -->
<div id="app" class="hide">
  <div class="top"><div><h1>গাড়ির হিসাব</h1><span id="who" class="mute"></span> <span id="role" class="badge"></span></div>
    <button class="mini" id="out">লগআউট</button></div>
  <div class="tabs" style="margin-top:12px"><button id="tNew" class="on">নতুন ট্রিপ</button><button id="tList">ট্রিপের তালিকা</button></div>

  <div id="pNew" class="card">
    <label for="when">তারিখ ও সময়</label><input id="when" type="datetime-local">
    <label for="cn">যাত্রীর নাম</label><input id="cn" autocomplete="off">
    <label for="cp">যাত্রীর ফোন (যেমন ০১৭১২৩৪৫৬৭৮)</label><input id="cp" type="tel" inputmode="tel">
    <div class="row"><div><label for="fp">কোথা থেকে *</label><input id="fp"></div><div><label for="tp">কোথায় *</label><input id="tp"></div></div>
    <div class="row"><div><label for="km">দূরত্ব (কিমি) *</label><input id="km" type="number" inputmode="decimal" min="0" step="0.1"></div>
      <div><label for="fare">ভাড়া (৳) *</label><input id="fare" type="number" inputmode="decimal" min="0"></div></div>
    <div class="row"><div><label for="fuel">তেলের খরচ (৳)</label><input id="fuel" type="number" inputmode="decimal" min="0"></div>
      <div><label for="gas">গ্যাসের খরচ (৳)</label><input id="gas" type="number" inputmode="decimal" min="0"></div></div>
    <div class="row"><div><label for="rep">মেরামত/রক্ষণাবেক্ষণ (৳)</label><input id="rep" type="number" inputmode="decimal" min="0"></div>
      <div><label for="oth">অন্যান্য খরচ (৳)</label><input id="oth" type="number" inputmode="decimal" min="0"></div></div>
    <label for="nt">চালকের নোট</label><textarea id="nt" rows="2"></textarea>
    <label for="img">রসিদের ছবি (গ্যালারি থেকে)</label><input id="img" type="file" accept="image/*">
    <button class="btn" id="save">ট্রিপ সংরক্ষণ করুন</button>
  </div>

  <div id="pList" class="hide"><div id="list"></div></div>
</div>
</div>
<div id="toast"></div>

<script>
/* ===== এখানে নিজের Supabase তথ্য বসান (Project Settings > API) ===== */
const SUPABASE_URL = 'https://vygydewglceniftlbtwt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0u2INR1KfbF479yS4JPPQg_4t7ONHT3';
/* ================================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const bn = n => Number(n || 0).toLocaleString('bn-BD');
const taka = n => '৳ ' + bn(n);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, mode = 'login', tt;

function toast(msg, ok = true) {
  const t = $('#toast'); t.textContent = msg; t.style.background = ok ? '#067647' : '#b42318'; t.style.display = 'block';
  clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 4000);
}
function bnErr(e) {
  const m = (e && e.message || '').toLowerCase();
  if (m.includes('invalid login')) return 'ইমেইল বা পাসওয়ার্ড ভুল হয়েছে।';
  if (m.includes('already registered')) return 'এই ইমেইলে আগেই অ্যাকাউন্ট আছে। লগইন করুন।';
  if (m.includes('not confirmed')) return 'আগে ইমেইলে পাঠানো লিংকে ক্লিক করে ইমেইল যাচাই করুন।';
  if (m.includes('rate limit') || m.includes('too many')) return 'অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।';
  if (m.includes('password')) return 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।';
  if (m.includes('duplicate') || m.includes('trips_no_dup')) return 'এই ট্রিপ আগেই সংরক্ষণ করা হয়েছে।';
  if (m.includes('fetch') || m.includes('network')) return 'ইন্টারনেট সংযোগ নেই। সংযোগ দেখে আবার চেষ্টা করুন।';
  return 'সমস্যা হয়েছে: ' + (e && e.message || 'অজানা');
}
function show(id) { ['#auth', '#reset', '#app'].forEach(x => $(x).classList.toggle('hide', x !== id)); }

/* ---- লগইন ---- */
function setMode(m) {
  mode = m;
  $('#tLogin').classList.toggle('on', m === 'login'); $('#tReg').classList.toggle('on', m === 'reg');
  $('#nameBox').classList.toggle('hide', m !== 'reg');
  $('#go').textContent = m === 'login' ? 'লগইন করুন' : 'অ্যাকাউন্ট খুলুন';
  $('#forgot').classList.toggle('hide', m !== 'login');
  $('#pw').autocomplete = m === 'login' ? 'current-password' : 'new-password';
}
$('#tLogin').onclick = () => setMode('login'); $('#tReg').onclick = () => setMode('reg');
$('#eye').onclick = () => { const p = $('#pw'); const h = p.type === 'password'; p.type = h ? 'text' : 'password'; $('#eye').textContent = h ? 'লুকান' : 'দেখান'; };

$('#go').onclick = async () => {
  const email = $('#email').value.trim(), password = $('#pw').value, name = $('#name').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast('সঠিক ইমেইল দিন।', false);
  if (password.length < 6) return toast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।', false);
  if (mode === 'reg' && !name) return toast('আপনার নাম লিখুন।', false);
  $('#go').disabled = true;
  try {
    if (mode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error;
    } else {
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.href.split('#')[0] } });
      if (error) throw error;
      if (!data.session) { toast('অ্যাকাউন্ট খোলা হয়েছে। ইমেইলে পাঠানো লিংকে ক্লিক করে যাচাই করুন, তারপর লগইন করুন।'); setMode('login'); }
    }
  } catch (e) { toast(bnErr(e), false); }
  $('#go').disabled = false;
};
$('#forgot').onclick = async () => {
  const email = $('#email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast('উপরে আপনার ইমেইল লিখুন, তারপর আবার চাপুন।', false);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
  error ? toast(bnErr(error), false) : toast('পাসওয়ার্ড বদলের লিংক ইমেইলে পাঠানো হয়েছে।');
};
$('#saveNp').onclick = async () => {
  const p = $('#np').value; if (p.length < 6) return toast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।', false);
  const { error } = await sb.auth.updateUser({ password: p });
  if (error) return toast(bnErr(error), false);
  toast('পাসওয়ার্ড বদলানো হয়েছে।'); $('#np').value = ''; start();
};
$('#out').onclick = async () => { await sb.auth.signOut(); };

/* ---- শুরু ---- */
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { me = null; return show('#auth'); }
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (error || !data) { toast('প্রোফাইল পাওয়া যায়নি। মালিকের সাথে যোগাযোগ করুন।', false); await sb.auth.signOut(); return; }
  me = data;
  $('#who').textContent = me.name || me.email;
  $('#role').textContent = me.role === 'owner' ? 'মালিক' : 'চালক';
  resetForm(); show('#app'); switchTab('new');
}
sb.auth.onAuthStateChange((ev) => {
  if (ev === 'PASSWORD_RECOVERY') show('#reset');
  else if (ev === 'SIGNED_OUT' || ev === 'SIGNED_IN') setTimeout(start, 0);
});

/* ---- ট্যাব ---- */
function switchTab(t) {
  $('#tNew').classList.toggle('on', t === 'new'); $('#tList').classList.toggle('on', t === 'list');
  $('#pNew').classList.toggle('hide', t !== 'new'); $('#pList').classList.toggle('hide', t !== 'list');
  if (t === 'list') loadList();
}
$('#tNew').onclick = () => switchTab('new'); $('#tList').onclick = () => switchTab('list');

/* ---- ট্রিপ যোগ ---- */
function nowLocal() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
function resetForm() {
  ['cn', 'cp', 'fp', 'tp', 'km', 'fare', 'fuel', 'gas', 'rep', 'oth', 'nt', 'img'].forEach(i => $('#' + i).value = '');
  $('#when').value = nowLocal();
}
const num = id => { const v = $('#' + id).value.trim(); return v === '' ? 0 : Number(v); };
const bnDigits = s => s.replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));

function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('ছবি')); }, 'image/jpeg', 0.7);
    };
    img.onerror = () => rej(new Error('ছবি পড়া যায়নি'));
    img.src = url;
  });
}

$('#save').onclick = async () => {
  const phone = bnDigits($('#cp').value.trim()).replace(/[\s-]/g, '');
  const when = $('#when').value, fp = $('#fp').value.trim(), tp = $('#tp').value.trim();
  const v = { km: num('km'), fare: num('fare'), fuel: num('fuel'), gas: num('gas'), rep: num('rep'), oth: num('oth') };
  if (!when) return toast('তারিখ ও সময় দিন।', false);
  if (new Date(when) > new Date(Date.now() + 5 * 60000)) return toast('ভবিষ্যতের তারিখ দেওয়া যাবে না।', false);
  if (!fp || !tp) return toast('কোথা থেকে এবং কোথায়, দুটোই লিখুন।', false);
  if ($('#km').value === '' || $('#fare').value === '') return toast('দূরত্ব ও ভাড়া লিখুন।', false);
  if (Object.values(v).some(x => !isFinite(x) || x < 0)) return toast('টাকা ও দূরত্ব ০ বা তার বেশি হতে হবে।', false);
  if (phone && !/^(\+?88)?01[3-9]\d{8}$/.test(phone)) return toast('ফোন নম্বর সঠিক নয়। যেমন: ০১৭১২৩৪৫৬৭৮', false);

  const btn = $('#save'); btn.disabled = true;
  try {
    const iso = new Date(when).toISOString();
    const { data: dup } = await sb.from('trips').select('id').eq('driver_id', me.id).eq('trip_at', iso).eq('fare', v.fare).eq('from_place', fp).eq('to_place', tp).limit(1);
    if (dup && dup.length) throw new Error('duplicate');
    let path = null; const f = $('#img').files[0];
    if (f) {
      const blob = await compress(f); path = `${me.id}/${Date.now()}.jpg`;
      const up = await sb.storage.from('receipts').upload(path, blob, { contentType: 'image/jpeg' }); if (up.error) throw up.error;
    }
    const { error } = await sb.from('trips').insert({
      trip_at: iso, customer_name: $('#cn').value.trim(), customer_phone: phone, from_place: fp, to_place: tp,
      distance_km: v.km, fare: v.fare, fuel_cost: v.fuel, gas_cost: v.gas, repair_cost: v.rep, other_cost: v.oth,
      notes: $('#nt').value.trim(), receipt_path: path
    });
    if (error) throw error;
    toast('ট্রিপ সংরক্ষণ হয়েছে।'); resetForm();
  } catch (e) { toast(bnErr(e), false); }
  btn.disabled = false;
};

/* ---- তালিকা ---- */
async function loadList() {
  $('#list').innerHTML = '<p class="mute">লোড হচ্ছে...</p>';
  const { data, error } = await sb.from('trips').select('*, profiles(name)').order('trip_at', { ascending: false }).limit(50);
  if (error) return $('#list').innerHTML = '<p class="cost">' + esc(bnErr(error)) + '</p>';
  if (!data.length) return $('#list').innerHTML = '<div class="card mute">এখনো কোনো ট্রিপ নেই। "নতুন ট্রিপ" থেকে প্রথম ট্রিপ যোগ করুন।</div>';
  $('#list').innerHTML = data.map(t => {
    const cost = +t.fuel_cost + +t.gas_cost + +t.repair_cost + +t.other_cost;
    return `<div class="card">
      <div class="top"><b>${esc(t.from_place)} থেকে ${esc(t.to_place)}</b><span class="fare">${taka(t.fare)}</span></div>
      <div class="mute">${new Date(t.trip_at).toLocaleString('bn-BD', { dateStyle: 'medium', timeStyle: 'short' })} · ${bn(t.distance_km)} কিমি</div>
      <div>খরচ: <span class="cost">${taka(cost)}</span> · লাভ: <b>${taka(t.fare - cost)}</b></div>
      <div class="mute">চালক: ${esc(t.profiles?.name || '-')}${t.customer_name ? ' · যাত্রী: ' + esc(t.customer_name) : ''}${t.customer_phone ? ' · ' + esc(t.customer_phone) : ''}</div>
      ${t.notes ? `<div class="mute">নোট: ${esc(t.notes)}</div>` : ''}
      ${t.receipt_path ? `<button class="mini" data-r="${esc(t.receipt_path)}">রসিদ দেখুন</button>` : ''}
      ${me.role === 'owner' ? `<button class="mini del" data-d="${t.id}" data-p="${esc(t.receipt_path || '')}">মুছুন</button>` : ''}
    </div>`;
  }).join('');
}
$('#list').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.r) {
    const { data, error } = await sb.storage.from('receipts').createSignedUrl(b.dataset.r, 120);
    return error ? toast(bnErr(error), false) : window.open(data.signedUrl, '_blank');
  }
  if (b.dataset.d) {
    if (!confirm('এই ট্রিপ চিরতরে মুছে ফেলবেন? এটা ফেরানো যাবে না।')) return;
    const { error } = await sb.from('trips').delete().eq('id', b.dataset.d);
    if (error) return toast(bnErr(error), false);
    if (b.dataset.p) await sb.storage.from('receipts').remove([b.dataset.p]);
    toast('ট্রিপ মুছে ফেলা হয়েছে।'); loadList();
  }
};

setMode('login'); start();
</script>
</body>
</html>
